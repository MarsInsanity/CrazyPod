name: CrazyPod build

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      firmware_only:
        description: >-
          Build only rockbox.ipod (about 2 MB, roughly a minute). Use when the
          device already has a full install and only the firmware is changing.
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  hardware:
    name: ${{ matrix.label }} firmware
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: ipod6g
            label: iPod 6G
            # The 6G's bootloader goes on over DFU with mks5lboot, not with
            # ipodpatcher, and is not built here.
            bootloader: dfu
            package: CrazyPod-6G.zip
          # Bring-up targets: they compile and package, but have not been
          # certified on hardware.
          - target: ipodvideo
            label: iPod Video (5G)
            bootloader: ipodpatcher
            package: CrazyPod-5G.zip
          - target: ipodmini2g
            label: iPod Mini 2G
            bootloader: ipodpatcher
            package: CrazyPod-Mini2G.zip
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            binutils-arm-none-eabi \
            gcc-arm-none-eabi \
            libfreetype6-dev \
            libnewlib-arm-none-eabi \
            binutils-mingw-w64-i686 \
            gcc-mingw-w64-i686 \
            make \
            perl \
            pkg-config \
            python3 \
            zip

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tools/miniapp-builder/package-lock.json

      - name: Build host font converter
        shell: bash
        run: make -C tools convttf

      - name: Build ${{ matrix.label }} firmware
        shell: bash
        run: |
          set -o pipefail
          flags=""
          if [ "${{ inputs.firmware_only }}" = "true" ]; then
            flags="--firmware-only"
          fi
          if ! ./build-hw.sh --target "${{ matrix.target }}" $flags 2>&1 \
              | tee build-hw.log; then
            {
              echo '## Hardware build log (tail)'
              echo '```text'
              tail -n 120 build-hw.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      # The Video and the Mini install their bootloader with ipodpatcher
      # rather than the 6G's DFU/NOR path, so ship the bootloader image
      # alongside the firmware.
      - name: Build ${{ matrix.label }} bootloader
        if: matrix.bootloader == 'ipodpatcher' && !inputs.firmware_only
        shell: bash
        run: ./build-bootloader.sh --target "${{ matrix.target }}"

      # Installing on those needs ipodpatcher, and most owners of one are on
      # Windows without a build environment. Cross-build the Windows binary
      # so the artifact carries everything the install needs.
      - name: Build ipodpatcher for Windows
        if: matrix.bootloader == 'ipodpatcher' && !inputs.firmware_only
        shell: bash
        run: |
          make -C utils/ipodpatcher \
            CROSS=i686-w64-mingw32- WINDRES=windres ipodpatcher.exe

      - name: Upload hardware build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crazypod-${{ matrix.target }}-build-log
          if-no-files-found: warn
          path: build-hw.log

      # Keep the firmware-only artifact to the single file that needs copying,
      # which is the point of the mode: about 2 MB rather than hundreds.
      - name: Upload firmware
        if: inputs.firmware_only
        uses: actions/upload-artifact@v4
        with:
          name: crazypod-${{ matrix.target }}-rockbox-ipod
          if-no-files-found: error
          path: build-hw-${{ matrix.target }}/rockbox.ipod

      - name: Upload firmware artifacts
        if: ${{ !inputs.firmware_only }}
        uses: actions/upload-artifact@v4
        with:
          name: crazypod-${{ matrix.target }}-firmware
          if-no-files-found: error
          path: |
            build-hw-${{ matrix.target }}/rockbox.ipod
            build-hw-${{ matrix.target }}/${{ matrix.package }}
            build-bootloader-${{ matrix.target }}/bootloader-${{ matrix.target }}.ipod
            utils/ipodpatcher/ipodpatcher.exe
            dist/miniapps/*.cpk

  simulator:
    name: macOS simulator
    runs-on: macos-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Install simulator dependencies
        run: |
          brew untap aws/tap || true
          HOMEBREW_NO_AUTO_UPDATE=1 brew install freetype sdl2 ffmpeg pkg-config

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tools/miniapp-builder/package-lock.json

      - name: Build host font converter
        shell: bash
        run: |
          export PKG_CONFIG_PATH="$(brew --prefix freetype)/lib/pkgconfig:${PKG_CONFIG_PATH:-}"
          make -C tools convttf

      - name: Build simulator
        shell: bash
        run: |
          set -o pipefail
          if ! ./build-sim.sh 2>&1 | tee build-sim.log; then
            {
              echo '## Simulator build log (tail)'
              echo '```text'
              tail -n 120 build-sim.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      # The Mini draws the monochrome build of the UI, which the 6G
      # simulator never exercises: everything below the design palette is a
      # different code path. Build it here so a regression in it is caught
      # without a device. It shares the runner because it is the shorter
      # build of the two -- no Mini Apps, no video engine.
      - name: Build iPod Mini 2G simulator
        shell: bash
        run: |
          set -o pipefail
          if ! ./build-sim.sh --target ipodmini2g 2>&1 \
              | tee build-sim-mini.log; then
            {
              echo '## iPod Mini 2G simulator build log (tail)'
              echo '```text'
              tail -n 120 build-sim-mini.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Upload simulator build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crazypod-macos-build-log
          if-no-files-found: warn
          path: |
            build-sim.log
            build-sim-mini.log

      - name: Upload simulator artifacts
        uses: actions/upload-artifact@v4
        with:
          name: crazypod-macos-simulator
          if-no-files-found: error
          path: |
            build-sim/rockboxui
            build-sim/CrazyPod Simulator.app
            build-sim-ipodmini2g/rockboxui
            build-sim-ipodmini2g/CrazyPod Simulator.app
